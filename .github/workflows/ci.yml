name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # go.sum appears with the first external dependency
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build and test with PAM
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g-dev
          go build -tags pam ./...
          go vet -tags pam ./...
          go test -tags pam ./internal/auth/
      - name: Format check
        if: always()
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Run gofmt -w on:"; echo "$files"
            gofmt -d .
            exit 1
          fi
