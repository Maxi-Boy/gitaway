# Пример для /etc/nginx/conf.d/gitaway.conf (прокси на локальный gitaway с поддержкой WebSocket).
# В config.json поставьте "trust_proxy": true, чтобы cookie получали флаг Secure.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ПУТЬ.crt;
    ssl_certificate_key /etc/ssl/private/ПУТЬ.key;

    location / {
        proxy_pass http://127.0.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
