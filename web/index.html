<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitaway</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0f1419; color: #e6edf3; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 18px; }
  input, button { font: inherit; padding: 6px 12px; border: 1px solid #3d444d; border-radius: 6px;
                  background: #21262d; color: #e6edf3; }
  input { min-width: 260px; }
  button { cursor: pointer; }
  button:hover { border-color: #58a6ff; }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  ul { padding-left: 18px; }
  .err { color: #ff7b72; }
  .out { background: #0b0f14; border: 1px solid #2a313c; border-radius: 6px; padding: 8px; overflow: auto; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script src="app.js"></script>
</body>
